version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: dailyfeed-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:15-alpine
    container_name: dailyfeed-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailyfeed-api
    restart: unless-stopped
    environment:
      CONFIG_FILE: /app/config.yaml
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    volumes:
      - ./backend/internal/config/config.yaml:/app/config.yaml

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailyfeed-scheduler
    restart: unless-stopped
    command: python -m cmd.scheduler.main
    depends_on:
      - redis
      - db

  fetcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailyfeed-fetcher
    restart: unless-stopped
    command: python -m cmd.fetcher.main
    depends_on:
      - redis
      - db

  summarizer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailyfeed-summarizer
    restart: unless-stopped
    command: python -m cmd.summarizer.main
    depends_on:
      - redis
      - db

  aggregator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailyfeed-aggregator
    restart: unless-stopped
    command: python -m cmd.aggregator.main
    depends_on:
      - redis
      - db

  pusher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailyfeed-pusher
    restart: unless-stopped
    command: python -m cmd.pusher.main
    depends_on:
      - redis
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dailyfeed-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend-api

  nginx:
    image: nginx:alpine
    container_name: dailyfeed-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend-api
      - frontend

volumes:
  redis_data:
  pg_data:
